# Nginx ВНУТРИ Docker.
#  - С доменом: хостовый Nginx (TLS) → 127.0.0.1:8080 → порт 80 здесь; app.<домен> → приложение.
#  - Без домена (по IP): порт 80 → сайт и онлайн-запись, порт 81 → приложение (веб-CRM).

upstream salon_api {
    server api:4000;
    keepalive 16;
}

# Поисковые роботы и превью ссылок (Яндекс, 2ГИС, Google, Telegram, VK, WhatsApp…): им страница салона
# /b/<slug> отдаётся готовым HTML с разметкой schema.org (API /v1/public/<slug>/page), людям — приложение записи.
map $http_user_agent $is_bot {
    default 0;
    "~*(yandex|googlebot|bingbot|2gis|telegrambot|vkshare|vk\.com|facebookexternalhit|twitterbot|whatsapp|slackbot|discordbot|applebot|duckduckbot|mail\.ru_bot|petalbot|bot/|crawler|spider)" 1;
}

map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

# Настоящий IP клиента. Заголовку X-Forwarded-For доверяем, только если запрос пришёл
# от хостового Nginx (через шлюз Docker). Прямой запрос из интернета (режим без домена)
# подделать свой IP через заголовок не сможет.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80 default_server;
    server_name _;
    set $root /srv/site;
    if ($host ~* ^app\.) { set $root /srv/app; }
    root $root;
    include /etc/nginx/snippets/salon-common.conf;
}

server {
    listen 81;
    server_name _;
    root /srv/app;
    include /etc/nginx/snippets/salon-common.conf;
}
