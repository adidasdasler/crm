# Nginx ВНУТРИ Docker. Наружу смотрит только 127.0.0.1:8080 → сюда.
# TLS терминирует хостовый Nginx (deploy/nginx/host-salon.conf).

upstream salon_api {
    server api:4000;
    keepalive 16;
}

# Общие настройки проксирования API
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 5m;

    # app.<домен> → веб-версия CRM, всё остальное → сайт и онлайн-запись
    set $root /srv/site;
    if ($host ~* ^app\.) { set $root /srv/app; }
    root $root;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /v1/ {
        proxy_pass http://salon_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 30s;
    }

    # Статика с хешами в имени — кешируем надолго
    location ~* ^/(assets|_expo)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: все остальные пути → index.html (без кеша, чтобы обновления приходили сразу)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
