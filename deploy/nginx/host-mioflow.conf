# Хостовый Nginx: /etc/nginx/sites-available/salon.conf
# Другие сайты и боты на сервере не затрагиваются — этот файл обслуживает только домены MioFlow.
# Замените mioflow.ru на свой домен. Сертификат: см. docs/DEPLOY.md (certbot).

limit_req_zone $binary_remote_addr zone=mioflow_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mioflow.ru www.mioflow.ru app.mioflow.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mioflow.ru www.mioflow.ru app.mioflow.ru;

    ssl_certificate     /etc/letsencrypt/live/mioflow.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mioflow.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mioflow_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 8m;

    location /v1/ {
        limit_req zone=mioflow_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
