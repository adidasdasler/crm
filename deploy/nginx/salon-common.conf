# Общие правила для сайта и приложения (подключается в internal.conf через include).
client_max_body_size 1m;
server_tokens off;

location /v1/ {
    proxy_pass http://salon_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # $remote_addr здесь — уже настоящий IP клиента (см. real_ip в internal.conf)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 30s;
}

# Мини-сайт салона: роботам — HTML с данными, людям — SPA
location ~ ^/b/([a-z0-9-]+)/?$ {
    set $salon $1;
    if ($is_bot) {
        rewrite ^ /v1/public/$salon/page break;
        proxy_pass http://salon_api;
    }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
}

# Загрузка фото дизайнов (сжатые на устройстве JPEG + миниатюра)
location = /v1/designs {
    client_max_body_size 8m;
    proxy_pass http://salon_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 60s;
}

# Фото мастера (до 2 МБ, сжимается на устройстве)
location ~ ^/v1/resources/[^/]+/photo$ {
    client_max_body_size 3m;
    proxy_pass http://salon_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 60s;
}

location = /config.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
}

# Статика с хешами в имени — кешируем надолго
location ~* ^/(assets|_expo)/ {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# SPA: все остальные пути → index.html (без кеша, чтобы обновления приходили сразу)
location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
