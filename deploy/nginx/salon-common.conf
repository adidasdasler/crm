# Общие правила для сайта и приложения (подключается в internal.conf через include).
client_max_body_size 5m;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;

location /v1/ {
    proxy_pass http://salon_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # $remote_addr здесь — уже настоящий IP клиента (см. real_ip в internal.conf)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 30s;
}

# Статика с хешами в имени — кешируем надолго
location ~* ^/(assets|_expo)/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# SPA: все остальные пути → index.html (без кеша, чтобы обновления приходили сразу)
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
