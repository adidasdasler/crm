# Заголовки безопасности. Подключается в КАЖДОМ location с add_header:
# в Nginx add_header внутри location отменяет заголовки, заданные уровнем выше.
# CSP: скрипты, шрифты и запросы — только с нашего сервера; стили — свои (React Native Web
# добавляет стили на лету, поэтому 'unsafe-inline' для style-src); чужие сайты не могут встроить страницу во фрейм.
# mc.yandex.ru / mc.yandex.com — Яндекс Метрика: сайт загружает её только после согласия посетителя на аналитические cookie.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru https://mc.yandex.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com; font-src 'self' data:; connect-src 'self' blob: data: https://mc.yandex.ru https://mc.yandex.com; frame-ancestors 'self' https://web.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
