# Production-стек Salon. Наружу открыт только 127.0.0.1:8080 — его проксирует хостовый Nginx.
name: salon

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-salon}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?задайте APP_DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks: [salon-net]

  api:
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    image: salon-api:latest
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment: &api-env
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://salon_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-salon}
      SYSTEM_DATABASE_URL: postgresql://${POSTGRES_USER:-salon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-salon}
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET (64+ символа)}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SEED_DEMO: ${SEED_DEMO:-false}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      APP_URL: ${APP_URL}
      API_PUBLIC_URL: ${PUBLIC_WEB_URL}/v1
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      SMS_RU_API_KEY: ${SMS_RU_API_KEY:-}
      SMS_SENDER: ${SMS_SENDER:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-yookassa}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 5
      start_period: 30s
    networks: [salon-net]

  # Фоновый воркер: напоминания клиентам (Telegram/SMS) и проверка подписок.
  # Тот же образ, что и api; очередь — таблица Reminder в PostgreSQL (Redis не нужен).
  worker:
    image: salon-api:latest
    pull_policy: never
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    command: ["node", "dist/worker.js"]
    environment: *api-env
    networks: [salon-net]

  # Внутренний Nginx: статика (сайт + веб-версия CRM) и проксирование /v1 → api.
  nginx:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?задайте PUBLIC_WEB_URL}
        APP_URL: ${APP_URL:?задайте APP_URL}
    restart: unless-stopped
    depends_on: [api]
    # По умолчанию слушаем только localhost (за хостовым Nginx с доменом).
    # Без домена: NGINX_BIND=0.0.0.0 — сайт на :8080, приложение на :8081 (deploy/install.sh).
    ports:
      - "${NGINX_BIND:-127.0.0.1}:${SITE_PORT:-8080}:80"
      - "${NGINX_BIND:-127.0.0.1}:${APP_PORT:-8081}:81"
    networks: [salon-net]

volumes:
  pgdata:

networks:
  salon-net:
