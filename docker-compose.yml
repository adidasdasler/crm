# Production-стек Salon. Наружу открыт только 127.0.0.1:8080 — его проксирует хостовый Nginx.
name: salon

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-salon}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?задайте APP_DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks: [salon-net]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?задайте REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [salon-net]

  api:
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://salon_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-salon}
      SYSTEM_DATABASE_URL: postgresql://${POSTGRES_USER:-salon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-salon}
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET (64+ символа)}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 5
      start_period: 30s
    networks: [salon-net]

  # Внутренний Nginx: статика (сайт + веб-версия CRM) и проксирование /v1 → api.
  nginx:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?задайте PUBLIC_WEB_URL}
        APP_URL: ${APP_URL:?задайте APP_URL}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:8080:80"
    networks: [salon-net]

volumes:
  pgdata:
  redisdata:

networks:
  salon-net:
